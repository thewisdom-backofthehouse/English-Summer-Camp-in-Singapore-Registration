<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Summer Camp in Singapore by The Wisdom Tutor</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:Arial,"Noto Sans Thai",sans-serif;background:#f5f7fa;color:#222}
.container{max-width:520px;margin:0 auto}.card{background:#fff;border-radius:24px;padding:28px 22px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.logo{text-align:center;font-size:50px;margin-bottom:8px}h1{text-align:center;margin:0;font-size:24px}.subtitle{text-align:center;color:#777;margin:8px 0 20px}
.status{text-align:center;color:#777;margin-bottom:20px}.welcome{background:#f5f7fa;border-radius:16px;padding:18px;margin-bottom:20px}.welcome-title{font-size:14px;color:#777;margin-bottom:5px}.welcome-name{font-size:20px;font-weight:bold}
.progress{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin:0 0 22px}.progress-bar{height:100%;background:#111;transition:.25s}.step-label{text-align:center;color:#777;font-size:13px;margin:-15px 0 18px}
.section-title{font-size:19px;font-weight:bold;margin-bottom:8px}.hint{color:#777;font-size:14px;line-height:1.6;margin-bottom:16px}
label{display:block;margin-top:14px;margin-bottom:6px;font-size:14px;color:#555}.required{color:#e53935;font-weight:bold;margin-left:3px}
input,textarea,select{width:100%;padding:13px 14px;border:1px solid #ddd;border-radius:12px;font-size:16px;outline:none;font-family:inherit;background:#fff}input:focus,textarea:focus,select:focus{border-color:#999}textarea{min-height:90px;resize:vertical}
.option{display:flex;align-items:center;gap:12px;padding:15px;margin-bottom:10px;border:2px solid #eee;border-radius:16px;cursor:pointer;transition:.2s}.option.selected{border-color:#111;background:#f5f5f5}.option input{width:20px;height:20px;flex:0 0 auto}.option-text{font-size:15px;line-height:1.5}
.file-box{padding:15px;border:1px solid #ddd;border-radius:14px;margin-bottom:12px;background:#fafafa}.file-box small{display:block;color:#888;margin-top:6px}
.nav{display:flex;gap:10px;margin-top:24px}.button{width:100%;border:none;border-radius:14px;padding:15px;font-size:17px;font-weight:bold;cursor:pointer;background:#111;color:#fff}.button.secondary{background:#eee;color:#333}.button:disabled{opacity:.55;cursor:not-allowed}
.review-card{padding:16px;background:#fafafa;border:1px solid #e5e5e5;border-radius:16px;margin-bottom:14px}.review-title{font-size:17px;font-weight:bold;margin-bottom:10px}.review-row{padding:9px 0;border-bottom:1px solid #eee}.review-row:last-child{border-bottom:0}.review-label{color:#888;font-size:13px;margin-bottom:3px}.review-value{font-size:15px;word-break:break-word;white-space:pre-wrap}
.notice{padding:14px;border-radius:12px;background:#fff8e1;color:#6d5300;font-size:13px;line-height:1.7;margin:14px 0}.check{display:flex;gap:10px;align-items:flex-start;margin:12px 0;padding:12px;background:#fafafa;border-radius:12px}.check input{width:20px;height:20px;flex:0 0 auto;margin-top:2px}.hidden{display:none}.success{text-align:center;padding:15px}.application-id{font-size:22px;font-weight:bold;margin:12px 0}.error{padding:15px;background:#fef2f2;color:#991b1b;border-radius:12px;margin-top:15px}
</style>
</head>
<body>
<div class="container"><div class="card">
<div class="logo">🎉</div>
<h1>English Summer Camp in Singapore by The Wisdom Tutor</h1>
<div class="subtitle">สมัครเข้าร่วม Summer Camp</div>
<div id="status" class="status">🔄 กำลังเชื่อมต่อ LINE...</div>
<div id="app"></div>
</div></div>

<script>
const LIFF_ID="2011359336-ypS6Foln";
const WEB_APP_URL="https://script.google.com/macros/s/AKfycbyO-zVxU4LIb21UkTugFI3w2HDpsGNgr9SEa2dcBjUlk-8L1s6bbRe2KEx6jWKpas1I/exec";
const TOTAL_STEPS=10;
let lineUser=null;
let currentStep=1;
let isSubmitting=false;

let applicationData={
  TravelRound:"",
  FullNameThai:"",
  FullNameEnglish:"",
  Nickname:"",
  BirthDate:"",
  Phone:"",
  LineID:"",
  CurrentAddress:"",
  ShirtSize:"",
  PassportFile:null,
  InsuranceFile:null,
  CourseFile:null,
  EmergencyName:"",
  EmergencyRelation:"",
  EmergencyPhone:"",
  EmergencyLine:"",
  Under18:"",
  Disease:"",
  Allergy:"",
  SevereFoodAllergy:"",
  SpecialFood:"",
  HealthNote:"",
  InternationalTravel:"",
  ExtraBaggage:"",
  ExtraBaggageFee:0,
  DepositStatus:"",
  ReceiptRequired:"",
  ReceiptName:"",
  TermsAccepted:false,
  TermsAcceptedAt:"",
  TermsVersion:"2026-01",
  Status:"DRAFT"
};

function setStatus(text){document.getElementById("status").textContent=text}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function value(id){const el=document.getElementById(id);return el?el.value.trim():""}
function required(id,msg){const v=value(id);if(!v){alert(msg);document.getElementById(id)?.focus();return null}return v}
function formatDate(v){if(!v)return "-";const p=v.split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:v}
function progress(){return `<div class="progress"><div class="progress-bar" style="width:${currentStep/TOTAL_STEPS*100}%"></div></div><div class="step-label">ขั้นตอนที่ ${currentStep} / ${TOTAL_STEPS}</div>`}
function option(name,valueText,label,selected){return `<label class="option ${selected===valueText?"selected":""}" onclick="choose('${name}','${valueText.replace(/'/g,"\\'")}')"><input type="radio" name="${name}" value="${escapeHtml(valueText)}" ${selected===valueText?"checked":""}><span class="option-text">${label}</span></label>`}
function choose(name,v){applicationData[name]=v;renderStep(currentStep)}

async function main(){
  try{
    setStatus("🔄 กำลังเริ่มต้น LIFF...");
    await liff.init({liffId:LIFF_ID});
    if(!liff.isLoggedIn()){setStatus("🔐 กำลังเข้าสู่ระบบ LINE...");liff.login();return}
    setStatus("🔄 กำลังอ่านข้อมูล LINE...");
    const p=await liff.getProfile();
    lineUser={userId:p.userId,displayName:p.displayName,pictureUrl:p.pictureUrl||""};
    setStatus("✅ เชื่อมต่อ LINE สำเร็จ");
    showWelcome();
    renderStep(1);
  }catch(e){console.error(e);setStatus("❌ เกิดข้อผิดพลาด");document.getElementById("app").innerHTML=`<div class="error">ไม่สามารถเชื่อมต่อ LINE ได้<br><br>${escapeHtml(e.message||e)}</div>`}
}
function showWelcome(){
 document.getElementById("app").insertAdjacentHTML("afterbegin",`<div class="welcome"><div class="welcome-title">ยินดีต้อนรับครับ</div><div class="welcome-name">${escapeHtml(lineUser.displayName)}</div></div>`);
}
function renderStep(step){
 currentStep=step;const app=document.getElementById("app");let body="";
 if(step===1) body=step1();
 if(step===2) body=step2();
 if(step===3) body=step3();
 if(step===4) body=step4();
 if(step===5) body=step5();
 if(step===6) body=step6();
 if(step===7) body=step7();
 if(step===8) body=step8();
 if(step===9) body=step9();
 if(step===10) body=step10();
 app.innerHTML=progress()+body;
 if(step===2) setTimeout(()=>document.getElementById("birthDate")?.focus(),0);
}
function nav(back=true){return `<div class="nav">${back&&currentStep>1?`<button class="button secondary" onclick="goBack()">← กลับ</button>`:""}<button class="button" onclick="goNext()">ถัดไป →</button></div>`}
function step1(){return `<div class="section-title">เลือกช่วงการเดินทาง</div><div class="hint">รอบที่ต้องการเข้าร่วม (เลือก 1 ข้อ)<span class="required">*</span></div>
${option("TravelRound","6-10 ตุลาคม 2026","6-10 ตุลาคม 2026 <b>(5 วัน)</b>",applicationData.TravelRound)}
${option("TravelRound","6-12 ตุลาคม 2026","6-12 ตุลาคม 2026 <b>(7 วัน)</b>",applicationData.TravelRound)}
${option("TravelRound","6-19 ตุลาคม 2026","6-19 ตุลาคม 2026 <b>(14 วัน)</b>",applicationData.TravelRound)}
${nav(false)}`}
function step2(){return `<div class="section-title">ข้อมูลผู้สมัคร</div><div class="hint">กรุณากรอกข้อมูลให้ตรงกับเอกสารสำคัญ</div>
<label>ชื่อ นามสกุล (ไทย)<span class="required">*</span></label><input id="fullNameThai" value="${escapeHtml(applicationData.FullNameThai)}" placeholder="กรุณากรอกชื่อ - นามสกุล">
<label>ชื่อ นามสกุล (ภาษาอังกฤษ)<span class="required">*</span></label><input id="fullNameEnglish" value="${escapeHtml(applicationData.FullNameEnglish)}" placeholder="เช่น JOHN DOE">
<label>ชื่อเล่น</label><input id="nickname" value="${escapeHtml(applicationData.Nickname)}" placeholder="ชื่อเล่น">
<label>วันเดือนปีเกิด<span class="required">*</span></label><input id="birthDate" type="date" value="${escapeHtml(applicationData.BirthDate)}">
<label>เบอร์โทรศัพท์<span class="required">*</span></label><input id="phone" type="tel" inputmode="numeric" maxlength="10" value="${escapeHtml(applicationData.Phone)}" placeholder="08xxxxxxxx">
<label>Line ID</label><input id="lineId" value="${escapeHtml(applicationData.LineID)}" placeholder="Line ID">
<label>ที่อยู่ปัจจุบัน<span class="required">*</span></label><textarea id="currentAddress" placeholder="บ้านเลขที่ ถนน ตำบล/แขวง อำเภอ/เขต จังหวัด รหัสไปรษณีย์">${escapeHtml(applicationData.CurrentAddress)}</textarea>${nav()}`}
function step3(){return `<div class="section-title">ขนาดเสื้อโครงการ</div><div class="hint">เลือกไซซ์เสื้อโครงการ<span class="required">*</span></div>
${["XS","S","M","L","XL","XXL"].map(x=>option("ShirtSize",x,x,applicationData.ShirtSize)).join("")}${nav()}`}
function step4(){return `<div class="section-title">ติดต่อฉุกเฉิน</div><div class="hint">กรุณาระบุบุคคลที่สามารถติดต่อได้ในกรณีฉุกเฉิน</div>
<label>ชื่อผู้ติดต่อฉุกเฉิน<span class="required">*</span></label><input id="emergencyName" value="${escapeHtml(applicationData.EmergencyName)}">
<label>ความสัมพันธ์<span class="required">*</span></label><input id="emergencyRelation" value="${escapeHtml(applicationData.EmergencyRelation)}" placeholder="เช่น บิดา / มารดา">
<label>เบอร์โทร<span class="required">*</span></label><input id="emergencyPhone" type="tel" inputmode="numeric" maxlength="10" value="${escapeHtml(applicationData.EmergencyPhone)}">
<label>Line (ถ้ามี)</label><input id="emergencyLine" value="${escapeHtml(applicationData.EmergencyLine)}">
<div class="section-title" style="margin-top:25px">📎 เอกสารเพิ่มเติม</div>
<div class="hint">รองรับไฟล์ไม่เกิน 10 MB ต่อไฟล์</div>
<div class="file-box"><label>หน้า Passport<span class="required">*</span></label><input id="passportFile" type="file" accept=".jpg,.jpeg,.png,.pdf">${applicationData.PassportFile?.name?`<small>เลือกแล้ว: ${escapeHtml(applicationData.PassportFile.name)}</small>`:""}</div>
<div class="file-box"><label>เอกสารประกันการเดินทาง<span class="required">*</span></label><input id="insuranceFile" type="file" accept=".jpg,.jpeg,.png,.pdf">${applicationData.InsuranceFile?.name?`<small>เลือกแล้ว: ${escapeHtml(applicationData.InsuranceFile.name)}</small>`:""}</div>
<div class="file-box"><label>เอกสารคอร์สเรียน<span class="required">*</span></label><input id="courseFile" type="file" accept=".jpg,.jpeg,.png,.pdf">${applicationData.CourseFile?.name?`<small>เลือกแล้ว: ${escapeHtml(applicationData.CourseFile.name)}</small>`:""}</div>
${nav()}`}
function step5(){return `<div class="section-title">สำหรับผู้สมัครอายุต่ำกว่า 18 ปี</div><div class="hint">ผู้สมัครอายุต่ำกว่า 18 ปีหรือไม่?<span class="required">*</span></div>
${option("Under18","ใช่","ใช่",applicationData.Under18)}${option("Under18","ไม่ใช่","ไม่ใช่",applicationData.Under18)}${nav()}`}
function step6(){return `<div class="section-title">ข้อมูลสุขภาพ</div><div class="hint">ข้อมูลนี้ใช้เพื่อเตรียมความพร้อมและดูแลผู้เข้าร่วมโครงการ</div>
<label>โรคประจำตัว (ถ้ามี)</label><textarea id="disease">${escapeHtml(applicationData.Disease)}</textarea>
<label>แพ้อาหารหรือยา (ระบุให้ชัดเจน)</label><textarea id="allergy">${escapeHtml(applicationData.Allergy)}</textarea>
<label>อาหารที่แพ้รุนแรง</label><textarea id="severeFoodAllergy">${escapeHtml(applicationData.SevereFoodAllergy)}</textarea>
<label>อาหารพิเศษ (เช่น ฮาลาล/มังสวิรัติ)</label><input id="specialFood" value="${escapeHtml(applicationData.SpecialFood)}">
<label>หมายเหตุเพิ่มเติม</label><textarea id="healthNote">${escapeHtml(applicationData.HealthNote)}</textarea>${nav()}`}
function step7(){return `<div class="section-title">ประสบการณ์การเดินทาง</div><div class="hint">เคยเดินทางต่างประเทศหรือไม่?<span class="required">*</span></div>
${option("InternationalTravel","เคย","เคย",applicationData.InternationalTravel)}${option("InternationalTravel","ไม่เคย","ไม่เคย",applicationData.InternationalTravel)}${nav()}`}
function step8(){return `<div class="section-title">ตัวเลือกเพิ่มเติม</div><div class="hint">ต้องการเพิ่มน้ำหนักกระเป๋า 20 กก. (ไป-กลับ) หรือไม่?</div>
${option("ExtraBaggage","ไม่ต้องการ","ไม่ต้องการ",applicationData.ExtraBaggage)}${option("ExtraBaggage","ต้องการ","ต้องการ <b>(มีค่าใช้จ่ายเพิ่ม 3,560 บาท)</b>",applicationData.ExtraBaggage)}${nav()}`}
function step9(){return `<div class="section-title">การชำระเงิน</div><div class="hint">สถานะการชำระมัดจำ<span class="required">*</span></div>
${option("DepositStatus","ยังไม่ชำระ","ยังไม่ชำระ",applicationData.DepositStatus)}${option("DepositStatus","ชำระแล้ว","ชำระแล้ว",applicationData.DepositStatus)}${nav()}`}
function step10(){return `<div class="section-title">ใบเสร็จรับเงินและยืนยันข้อมูล</div><div class="hint">ต้องการออกใบเสร็จหรือไม่?</div>
${option("ReceiptRequired","ไม่ต้องการ","ไม่ต้องการ",applicationData.ReceiptRequired)}${option("ReceiptRequired","ต้องการ","ต้องการ",applicationData.ReceiptRequired)}
${applicationData.ReceiptRequired==="ต้องการ"?`<label>ชื่อที่ต้องการให้ออกใบเสร็จ<span class="required">*</span></label><input id="receiptName" value="${escapeHtml(applicationData.ReceiptName)}">`:""}
<div class="notice">ข้าพเจ้าขอยืนยันว่าข้อมูลที่กรอกถูกต้องครบถ้วน และยินยอมรับเงื่อนไขของโครงการ</div>
<label class="check"><input id="termsAccepted" type="checkbox" ${applicationData.TermsAccepted?"checked":""}><span>ข้าพเจ้ายืนยันว่า <b>ข้อมูลถูกต้องครบถ้วน</b> และ <b>ยินยอมรับเงื่อนไขของโครงการ</b><span class="required">*</span></span></label>
${nav()}`}
function saveVisible(){
 const ids=["fullNameThai","fullNameEnglish","nickname","birthDate","phone","lineId","currentAddress","emergencyName","emergencyRelation","emergencyPhone","emergencyLine","disease","allergy","severeFoodAllergy","specialFood","healthNote","receiptName"];
 const map={fullNameThai:"FullNameThai",fullNameEnglish:"FullNameEnglish",nickname:"Nickname",birthDate:"BirthDate",phone:"Phone",lineId:"LineID",currentAddress:"CurrentAddress",emergencyName:"EmergencyName",emergencyRelation:"EmergencyRelation",emergencyPhone:"EmergencyPhone",emergencyLine:"EmergencyLine",disease:"Disease",allergy:"Allergy",severeFoodAllergy:"SevereFoodAllergy",specialFood:"SpecialFood",healthNote:"HealthNote",receiptName:"ReceiptName"};
 ids.forEach(id=>{const el=document.getElementById(id);if(el)applicationData[map[id]]=el.value.trim()});
}
function validateStep(){
 saveVisible();
 if(currentStep===1&&!applicationData.TravelRound)return alert("กรุณาเลือกรอบการเดินทาง"),false;
 if(currentStep===2){
   for(const [k,msg] of [["FullNameThai","กรุณากรอกชื่อ นามสกุล (ไทย)"],["FullNameEnglish","กรุณากรอกชื่อ นามสกุล (ภาษาอังกฤษ)"],["BirthDate","กรุณากรอกวันเดือนปีเกิด"],["Phone","กรุณากรอกเบอร์โทรศัพท์"],["CurrentAddress","กรุณากรอกที่อยู่ปัจจุบัน"]])if(!applicationData[k])return alert(msg),false;
 }
 if(currentStep===3&&!applicationData.ShirtSize)return alert("กรุณาเลือกไซซ์เสื้อ"),false;
 if(currentStep===4){for(const [k,msg] of [["EmergencyName","กรุณากรอกชื่อผู้ติดต่อฉุกเฉิน"],["EmergencyRelation","กรุณากรอกความสัมพันธ์"],["EmergencyPhone","กรุณากรอกเบอร์โทรฉุกเฉิน"]])if(!applicationData[k])return alert(msg),false;}
 if(currentStep===5&&!applicationData.Under18)return alert("กรุณาเลือกว่าผู้สมัครอายุต่ำกว่า 18 ปีหรือไม่"),false;
 if(currentStep===7&&!applicationData.InternationalTravel)return alert("กรุณาเลือกประสบการณ์การเดินทาง"),false;
 if(currentStep===8){if(!applicationData.ExtraBaggage)return alert("กรุณาเลือกตัวเลือกน้ำหนักกระเป๋า"),false;applicationData.ExtraBaggageFee=applicationData.ExtraBaggage==="ต้องการ"?3560:0}
 if(currentStep===9&&!applicationData.DepositStatus)return alert("กรุณาเลือกสถานะการชำระมัดจำ"),false;
 if(currentStep===10){if(!applicationData.ReceiptRequired)return alert("กรุณาเลือกว่าต้องการออกใบเสร็จหรือไม่"),false;if(applicationData.ReceiptRequired==="ต้องการ"&&!applicationData.ReceiptName)return alert("กรุณาระบุชื่อที่ต้องการให้ออกใบเสร็จ"),false;if(!document.getElementById("termsAccepted")?.checked)return alert("กรุณายืนยันข้อมูลและยอมรับเงื่อนไขของโครงการ"),false;applicationData.TermsAccepted=true;applicationData.TermsAcceptedAt=new Date().toISOString()}
 return true;
}
function goNext(){if(!validateStep())return;if(currentStep<TOTAL_STEPS)renderStep(currentStep+1);else showReview()}
function goBack(){saveVisible();if(currentStep>1)renderStep(currentStep-1)}
function fileToBase64(file){return new Promise((resolve,reject)=>{if(!file)return resolve(null);if(file.size>10*1024*1024)return reject(new Error("ไฟล์มีขนาดเกิน 10 MB"));const r=new FileReader();r.onload=()=>resolve({name:file.name,mimeType:file.type||"application/octet-stream",data:r.result.split(",")[1]});r.onerror=reject;r.readAsDataURL(file)})}
function reviewRow(label,v){return `<div class="review-row"><div class="review-label">${label}</div><div class="review-value">${escapeHtml(v||"-")}</div></div>`}
function showReview(){
 currentStep=10;const app=document.getElementById("app");
 app.innerHTML=`<div class="section-title">🔎 ตรวจสอบข้อมูล</div><div class="hint">กรุณาตรวจสอบข้อมูลทั้งหมดก่อนยืนยันการสมัคร</div>
 <div class="review-card"><div class="review-title">✈️ รอบเดินทาง</div>${reviewRow("รอบที่เลือก",applicationData.TravelRound)}</div>
 <div class="review-card"><div class="review-title">👤 ข้อมูลผู้สมัคร</div>${reviewRow("ชื่อไทย",applicationData.FullNameThai)}${reviewRow("ชื่ออังกฤษ",applicationData.FullNameEnglish)}${reviewRow("ชื่อเล่น",applicationData.Nickname)}${reviewRow("วันเกิด",formatDate(applicationData.BirthDate))}${reviewRow("เบอร์โทร",applicationData.Phone)}${reviewRow("Line ID",applicationData.LineID)}${reviewRow("ที่อยู่",applicationData.CurrentAddress)}</div>
 <div class="review-card"><div class="review-title">👕 เสื้อโครงการ</div>${reviewRow("ไซซ์",applicationData.ShirtSize)}</div>
 <div class="review-card"><div class="review-title">🚨 ติดต่อฉุกเฉิน</div>${reviewRow("ชื่อ",applicationData.EmergencyName)}${reviewRow("ความสัมพันธ์",applicationData.EmergencyRelation)}${reviewRow("โทร",applicationData.EmergencyPhone)}${reviewRow("Line",applicationData.EmergencyLine)}</div>

async function collectFiles(){
 const p=document.getElementById("passportFile")?.files[0],i=document.getElementById("insuranceFile")?.files[0],c=document.getElementById("courseFile")?.files[0];
 if(p)applicationData.PassportFile=await fileToBase64(p);
 if(i)applicationData.InsuranceFile=await fileToBase64(i);
 if(c)applicationData.CourseFile=await fileToBase64(c);
}
async function submitApplication(){
 if(isSubmitting)return;
 isSubmitting=true;const btn=document.getElementById("submitBtn");if(btn){btn.disabled=true;btn.textContent="⏳ กำลังบันทึกข้อมูล..."}
 try{
   await collectFiles();
   const payload={...applicationData,LineUserID:lineUser?.userId||"",LineDisplayName:lineUser?.displayName||"",SubmittedAt:new Date().toISOString()};
   const res=await fetch(WEB_APP_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
   const result=await res.json();
   if(!result.success)throw new Error(result.message||"ไม่สามารถบันทึกข้อมูลได้");
   setStatus("✅ สมัครเรียบร้อยแล้ว");showSuccess(result.applicationID);
 }catch(e){console.error(e);alert("❌ ไม่สามารถบันทึกข้อมูลได้\\n\\n"+(e.message||e));if(btn){btn.disabled=false;btn.textContent="✅ ยืนยันและส่งข้อมูล"}isSubmitting=false}
}
function showSuccess(id){document.getElementById("app").innerHTML=`<div class="success"><div style="font-size:55px">🎉</div><h2>สมัครเรียบร้อยแล้ว</h2><p>ระบบได้รับข้อมูลการสมัครของคุณแล้ว</p><div class="application-id">${escapeHtml(id)}</div><p style="color:#777">กรุณาเก็บเลขใบสมัครนี้ไว้สำหรับติดต่อโครงการ</p></div>`}
main();
</script>
