<script>


// ============================================
// LIFF CONFIG
// ============================================

const LIFF_ID =
  "2011359336-ypS6Foln";


// ============================================
// GLOBAL USER
// ============================================

let lineUser = null;

let applicationData = {

  USER_ID: "",
  DisplayName: "",

  // =========================
  // ข้อมูลผู้สมัคร
  // =========================

  FullName: "",
  IDCard: "",
  LaserID: "",
  BirthDate: "",
  IDExpireDate: "",
  Nationality: "",
  Phone: "",
  Email: "",

  Weight: "",
  Height: "",
  Disease: "",
  HospitalHistory: "",

  // =========================
  // การชำระเงิน
  // =========================

  PaymentMethod: "",
  PaymentFrequency: "",

  // =========================
  // การทำงาน
  // =========================

  Occupation: "",
  Company: "",
  WorkAddress: "",
  WorkPhone: "",
  Position: "",
  JobDescription: "",
  AnnualIncome: "",

  // =========================
  // ที่อยู่
  // =========================

  CurrentAddress: null,
  HouseAddress: null,
  SameAddress: false,

  // =========================
  // ผู้รับผลประโยชน์
  // =========================

  Beneficiaries: []

  

};

let beneficiaries = [];

// ============================================
// START LIFF
// ============================================

async function main() {

  try {

    setStatus(
      "🔄 กำลังเริ่มต้น LIFF..."
    );


    // ------------------------------------------
    // Initialize
    // ------------------------------------------

    await liff.init({

      liffId: LIFF_ID

    });


    // ------------------------------------------
    // Login
    // ------------------------------------------

    if (!liff.isLoggedIn()) {

      setStatus(
        "🔐 กำลังเข้าสู่ระบบ LINE..."
      );

      liff.login();

      return;

    }


    // ------------------------------------------
    // Get Profile
    // ------------------------------------------

    setStatus(
      "🔄 กำลังอ่านข้อมูล LINE..."
    );


    const profile =
      await liff.getProfile();


    lineUser = {

      userId:
        profile.userId,

      displayName:
        profile.displayName,

      pictureUrl:
        profile.pictureUrl || ""

    };


    console.log(
      "LINE USER:",
      lineUser
    );


    // ------------------------------------------
    // Show Application Form
    // ------------------------------------------

    setStatus(
      "✅ เชื่อมต่อ LINE สำเร็จ"
    );


    showApplicationForm();


  } catch (error) {

    console.error(error);


    setStatus(
      "❌ เกิดข้อผิดพลาด"
    );


    document.getElementById(
      "app"
    ).innerHTML = `

      <div class="error">

        ไม่สามารถเชื่อมต่อ LINE ได้

        <br><br>

        ${escapeHtml(
          error.message ||
          error.toString()
        )}

      </div>

    `;

  }

}

// ============================================
// APPLICATION FORM
// ============================================

  // ค่าที่เคยกรอกไว้
  // ==========================================

              ? "selected"
              : ""
          }
        "
        onclick="
          selectPayment(
            'QR Code ออนไลน์'
          )
        "
        id="payment-qr"
      >

        <div style="
          font-size:28px;
        ">
          📱
        </div>

        <div>

          <div style="
            font-weight:bold;
            font-size:16px;
          ">
            รอบที่ 1
          </div>

        </div>

      </div>


      <!-- ================================= -->
      <!-- CREDIT CARD -->
      <!-- ================================= -->

      <div
        class="payment-option
          ${
            data.PaymentMethod ===
            "บัตรเครดิต"
              ? "selected"
              : ""
          }
        "
        onclick="
          selectPayment(
            'บัตรเครดิต'
          )
        "
        id="payment-card"
      >

        <div style="
          font-size:28px;
        ">
          💳
        </div>

        <div>

          <div style="
            font-weight:bold;
            font-size:16px;
          ">
            รอบที่ 2
          </div>

          

        </div>

      </div>


      

      <!-- ================================= -->
      <!-- ชื่อ -->
      <!-- ================================= -->

      <label>
        ชื่อ - นามสกุล
        <span class="required">*</span>
      </label>

      <input
        id="fullName"
        type="text"
        placeholder="กรุณากรอกชื่อ - นามสกุล"
        value="${escapeHtml(
          data.FullName || ""
        )}"
      >


      <!-- ================================= -->
      <!-- เลขบัตรประชาชน -->
      <!-- ================================= -->

      <label>
        เลขบัตรประชาชน
        <span class="required">*</span>
      </label>

      <!-- ================================= -->

      <!-- ================================= -->

      </label>

        type="date"
        value="${escapeHtml(
          data.BirthDate || ""

      >


      <!-- ================================= -->
      <!-- วันหมดอายุ -->
      <!-- ================================= -->

      <label>
        วันหมดอายุบัตรประชาชน
        <span class="required">*</span>
      </label>

      <input
        id="idExpireDate"
        type="date"
        value="${escapeHtml(
          data.IDExpireDate || ""
        )}"
      >


      <!-- ================================= -->
      <!-- สัญชาติ -->
      <!-- ================================= -->

      <label>
        สัญชาติ
        <span class="required">*</span>
      </label>

      <input
        id="nationality"
        type="text"
        placeholder="เช่น ไทย"
        value="${escapeHtml(
          data.Nationality || "ไทย"
        )}"
      >


      <!-- ================================= -->
      <!-- เบอร์โทร -->
      <!-- ================================= -->

      <label>
        เบอร์โทรศัพท์
        <span class="required">*</span>
      </label>

      <input
        id="phone"
        type="tel"
        inputmode="numeric"
        maxlength="10"
        placeholder="08xxxxxxxx"
        value="${escapeHtml(
          data.Phone || ""
        )}"
      >


      <!-- ================================= -->
      <!-- Email -->
      <!-- ================================= -->

      <label>
        อีเมล
        <span class="required">*</span>
      </label>

      <input
        id="email"
        type="email"
        placeholder="example@email.com"
        value="${escapeHtml(
          data.Email || ""
        )}"
      >


      <!-- ================================= -->
      <!-- น้ำหนัก -->

        placeholder="เช่น 70"
        value="${escapeHtml(
          data.Weight || ""
        )}"
      >


      <!-- ================================= -->
      <!-- ส่วนสูง -->
      <!-- ================================= -->

      <label>
        ส่วนสูง (ซม.)
        <span class="required">*</span>
      </label>

      <input
        id="height"
        type="number"
        inputmode="numeric"
        placeholder="เช่น 170"
        value="${escapeHtml(
          data.Height || ""
        )}"
      >


      <!-- ================================= -->
      <!-- โรคประจำตัว -->

      >${escapeHtml(

// ============================================
// NEXT STEP
// ============================================

function nextStep() {

  // ==========================================
  // ชื่อ - นามสกุล
  // ==========================================

  const fullName =
    getRequiredValue(
      "fullName",
      "กรุณากรอกชื่อ - นามสกุล"
    );

  if (fullName === null) return;


  // ==========================================
  // เลขบัตรประชาชน
  // ==========================================

  const idCard =
    getRequiredValue(
      "idCard",
      "กรุณากรอกเลขบัตรประชาชน"
    );

  if (idCard === null) return;


  // ตรวจเลขบัตร 13 หลัก
  const cleanIDCard =
    idCard.replace(/\D/g, "");

  if (cleanIDCard.length !== 13) {

    alert(
      "เลขบัตรประชาชนต้องมี 13 หลัก"
    );

    document
      .getElementById("idCard")
      .focus();

    return;

  }


  // ==========================================
  // เลขหลังบัตร
  // ==========================================

  const laserID =
    getRequiredValue(
      "laserID",
      "กรุณากรอกเลขหลังบัตรประชาชน"
    );

  if (laserID === null) return;


  // ==========================================
  // วันเดือนปีเกิด
  // ==========================================

  const birthDate =
    getRequiredValue(
      "birthDate",
      "กรุณากรอกวันเดือนปีเกิด"
    );

  if (birthDate === null) return;


  // ==========================================
  // วันหมดอายุบัตร
  // ==========================================

  const idExpireDate =
    getRequiredValue(
      "idExpireDate",
      "กรุณากรอกวันหมดอายุบัตรประชาชน"
    );

  if (idExpireDate === null) return;


  // ==========================================
  // สัญชาติ
  // ==========================================

  const nationality =
    getRequiredValue(
      "nationality",
      "กรุณากรอกสัญชาติ"
    );

  if (nationality === null) return;


  // ==========================================
  // เบอร์โทรศัพท์
  // ==========================================

  const phone =
    getRequiredValue(
      "phone",
      "กรุณากรอกเบอร์โทรศัพท์"
    );

  if (phone === null) return;


  // ตรวจเบอร์โทร
  const cleanPhone =
    phone.replace(/\D/g, "");

  if (
    cleanPhone.length !== 10 ||
    !cleanPhone.startsWith("0")
  ) {

    alert(
      "กรุณากรอกเบอร์โทรศัพท์ให้ถูกต้อง เช่น 0812345678"
    );

    document
      .getElementById("phone")
      .focus();

    return;

  }

  // ==========================================
  // Email
  // ==========================================

  const emailElement =
    document.getElementById(
      "email"
    );
  
  const email =
    emailElement
      ? emailElement.value.trim()
      : "";


  // ==========================================
  // น้ำหนัก
  // ==========================================

  const weight =
    getRequiredValue(
      "weight",
      "กรุณากรอกน้ำหนัก"
    );

  if (weight === null) return;


  if (
    Number(weight) <= 0 ||
    Number(weight) > 500
  ) {

    alert(
      "กรุณาตรวจสอบน้ำหนักอีกครั้ง"
    );

    document
      .getElementById("weight")
      .focus();

    return;

  }


  // ==========================================
  // ส่วนสูง
  // ==========================================

  const height =
    getRequiredValue(
      "height",
      "กรุณากรอกส่วนสูง"
    );

  if (height === null) return;


  if (
    Number(height) <= 0 ||
    Number(height) > 250
  ) {

    alert(
      "กรุณาตรวจสอบส่วนสูงอีกครั้ง"
    );

    document
      .getElementById("height")
      .focus();

    return;

  }


  // ==========================================
  // โรคประจำตัว
  // ==========================================

  const disease =
    getRequiredValue(
      "disease",
      "กรุณาระบุโรคประจำตัว\nหากไม่มี กรุณาพิมพ์ว่า ไม่มี"
    );

  if (disease === null) return;


  // ==========================================
  // ประวัติการรักษา
  // ไม่ Required
  // ==========================================

  const hospitalHistoryElement =
    document.getElementById(
      "hospitalHistory"
    );


  const hospitalHistory =
    hospitalHistoryElement
      ? hospitalHistoryElement.value.trim()
      : "";

  // ==========================================
  // บันทึกข้อมูลลง applicationData
  // ==========================================

  applicationData.FullName =
    fullName;

  applicationData.IDCard =
    cleanIDCard;

  applicationData.LaserID =
    laserID;

  applicationData.BirthDate =
    birthDate;

  applicationData.IDExpireDate =
    idExpireDate;

  applicationData.Nationality =
    nationality;

  applicationData.Phone =
    cleanPhone;

  applicationData.Email =
    email;

  applicationData.Weight =
    weight;

  applicationData.Height =
    height;

  applicationData.Disease =
    disease;

  applicationData.HospitalHistory =
    hospitalHistory;


  // ==========================================
  // DEBUG
  // ==========================================

  console.log(
    "APPLICATION DATA UPDATED"
  );


  // ==========================================
  // ไป STEP 2
  // ==========================================

  showPaymentForm();

}

// ============================================
// SELECT PAYMENT
// ============================================

function selectPayment(method) {

  applicationData.PaymentMethod =
    method;


  // เอา selected ออกจากทุกตัว

  document
    .querySelectorAll(
      ".payment-option"
    )
    .forEach(el => {

      el.classList.remove(
        "selected"
      );

    });


  // ใส่ selected ให้ตัวที่เลือก

  if (
    method ===
    "QR Code ออนไลน์"
  ) {

    document
      .getElementById(
        "payment-qr"
      )
      ?.classList.add(
        "selected"
      );

  }


  if (
    method ===
    "บัตรเครดิต"
  ) {

    document
      .getElementById(
        "payment-card"
      )
      ?.classList.add(
        "selected"
      );

  }

}

// ============================================
// SELECT FREQUENCY
// ============================================

function selectFrequency(frequency) {

  applicationData.PaymentFrequency =
    frequency;


  // เอา selected ออกจากทุกปุ่ม

  document
    .querySelectorAll(
      ".frequency-button"
    )
    .forEach(btn => {

      btn.classList.remove(
        "selected"
      );

    });


  // หา ID ของปุ่ม

  let id = "";


  if (
    frequency ===
    "รายปี"
  ) {

    id = "freq-year";

  }


  if (
    frequency ===
    "ราย 6 เดือน"
  ) {

    id = "freq-6m";

  }


  if (
    frequency ===
    "ราย 3 เดือน"
  ) {

    id = "freq-3m";

  }


  if (id) {

    document
      .getElementById(id)
      ?.classList.add(
        "selected"
      );

  }

}

  // ==========================================

  // ==========================================

// ============================================
// OCCUPATION CHANGED
// ============================================

function occupationChanged() {

  const occupation =
    document.getElementById(
      "occupation"
    ).value;


  // เก็บอาชีพทันที

  applicationData.Occupation =
    occupation;


  const workFields =
    document.getElementById(
      "workFields"
    );


  if (!workFields) return;


  if (occupation) {

    workFields.style.display =
      "block";

  } else {

    workFields.style.display =
      "none";

  }

}
  
// ============================================
// NEXT WORK STEP
// ============================================

function nextWorkStep() {

  // ==========================================
  // อาชีพ
  // ==========================================

  const occupation =
    document.getElementById(
      "occupation"
    ).value.trim();

  if (!occupation) {

    alert(
      "กรุณาเลือกอาชีพปัจจุบัน"
    );

    document
      .getElementById("occupation")
      .focus();

    return;

  }


  // ==========================================
  // สถานที่ทำงาน
  // ==========================================

  const company =
    getRequiredValue(
      "company",
      "กรุณากรอกสถานที่ทำงาน"
    );

  if (company === null) return;


  // ==========================================
  // ที่อยู่ที่ทำงาน
  // ==========================================

  const workAddress =
    getRequiredValue(
      "workAddress",
      "กรุณากรอกที่อยู่ที่ทำงาน"
    );

  if (workAddress === null) return;


  // ==========================================
  // เบอร์โทรศัพท์ที่ทำงาน
  // ==========================================

  const workPhone =
    getRequiredValue(
      "workPhone",
      "กรุณากรอกเบอร์โทรศัพท์ที่ทำงาน"
    );

  if (workPhone === null) return;


  // ตรวจเบอร์โทรศัพท์ที่ทำงาน
  const cleanWorkPhone =
    workPhone.replace(/\D/g, "");


  if (
    cleanWorkPhone.length < 9 ||
    cleanWorkPhone.length > 10
  ) {

    alert(
      "กรุณาตรวจสอบเบอร์โทรศัพท์ที่ทำงาน"
    );

    document
      .getElementById("workPhone")
      .focus();

    return;

  }


  // ==========================================
  // ตำแหน่ง
  // ==========================================

  const position =
    getRequiredValue(
      "position",
      "กรุณากรอกตำแหน่ง"
    );

  if (position === null) return;


  // ==========================================
  // ลักษณะงาน
  // ==========================================

  const jobDescription =
    getRequiredValue(
      "jobDescription",
      "กรุณากรอกลักษณะงาน"
    );

  if (jobDescription === null) return;


  // ==========================================
  // รายได้ต่อปี
  // ==========================================

  const annualIncome =
    getRequiredValue(
      "annualIncome",
      "กรุณากรอกรายได้ต่อปี"
    );

  if (annualIncome === null) return;


  // ตรวจรายได้
  if (
    Number(annualIncome) <= 0
  ) {

    alert(
      "กรุณาตรวจสอบรายได้ต่อปี"
    );

    document
      .getElementById("annualIncome")
      .focus();

    return;

  }


  // ==========================================
  // บันทึกข้อมูล
  // ==========================================

  applicationData.Occupation =
    occupation;

  applicationData.Company =
    company;

  applicationData.WorkAddress =
    workAddress;

  applicationData.WorkPhone =
    cleanWorkPhone;

  applicationData.Position =
    position;

  applicationData.JobDescription =
    jobDescription;

  applicationData.AnnualIncome =
    annualIncome;


  // ==========================================
  // DEBUG
  // ==========================================

  console.log(
    "WORK DATA SAVED"
  );


  // ==========================================
  // ไป STEP 4
  // ==========================================

  showAddressForm();

}

function sameAddressChanged() {

    );

  if (!checkbox || !fields) {
    return;
  }


  if (checkbox.checked) {

    // ========================================
    // คัดลอก Current → House
    // ========================================

    const currentAddress = {

      houseNo:
        document
          .getElementById(
            "currentHouseNo"
          )
          .value.trim(),

      moo:
        document
          .getElementById(
            "currentMoo"
          )
          .value.trim(),

      soi:
        document
          .getElementById(
            "currentSoi"
          )
          .value.trim(),

      road:
        document
          .getElementById(
            "currentRoad"
          )
          .value.trim(),

      subDistrict:
        document
          .getElementById(
            "currentSubDistrict"
          )
          .value.trim(),

      district:
        document
          .getElementById(
            "currentDistrict"
          )
          .value.trim(),

      province:
        document
          .getElementById(
            "currentProvince"
          )
          .value.trim(),

      postalCode:
        document
          .getElementById(
            "currentPostalCode"
          )
          .value.trim()

    };


    // ========================================
    // เก็บไว้ใน applicationData
    // ========================================

    applicationData.CurrentAddress =
      currentAddress;

    applicationData.HouseAddress =
      {
        ...currentAddress
      };

    applicationData.SameAddress =
      true;


    // ========================================
    // ซ่อนทะเบียนบ้าน
    // ========================================

    fields.style.display =
      "none";


  } else {

    applicationData.SameAddress =
      false;

    fields.style.display =
      "block";

  }

}

function addBeneficiary() {

  if (

  // ==========================================

// ============================================
// SAVE BENEFICIARY FIELDS
// ============================================

function saveBeneficiaryFields() {

  const list =
    applicationData.Beneficiaries || [];


  list.forEach(function(person, index) {

    const name =
      document.getElementById(
        `beneficiaryName${index}`
      );

    const relation =
      document.getElementById(
        `beneficiaryRelation${index}`
      );

    const age =
      document.getElementById(
        `beneficiaryAge${index}`
      );

    const idCard =
      document.getElementById(
        `beneficiaryIDCard${index}`
      );


    if (name) {
      person.Name =
        name.value.trim();
    }


    if (relation) {
      person.Relation =
        relation.value.trim();
    }


    if (age) {
      person.Age =
        age.value.trim();
    }


    if (idCard) {
      person.IDCard =
        idCard.value.trim();
    }

  });

}

function removeBeneficiary(index) {

  const list =
    applicationData.Beneficiaries || [];


  // ------------------------------------------
  // ป้องกัน index ผิด
  // ------------------------------------------

  if (
    index < 0 ||
    index >= list.length
  ) {

    return;

  }


  // ------------------------------------------
  // ต้องเหลืออย่างน้อย 1 คน
  // ------------------------------------------

  if (list.length <= 1) {

    alert(
      "ต้องมีผู้รับผลประโยชน์อย่างน้อย 1 คนครับ"
    );

    return;

  }


  // ------------------------------------------
  // ลบข้อมูล
  // ------------------------------------------

  list.splice(index, 1);


  // ------------------------------------------
  // Render ใหม่
  // ------------------------------------------

  applicationData.Beneficiaries =
    list;

  renderBeneficiaries();

}

// ============================================

function nextBeneficiaryStep() {

  // บันทึกข้อมูลจากหน้าจอก่อน
  saveBeneficiaryFields();


  const list =
    applicationData.Beneficiaries || [];


  if (list.length === 0) {

    alert(
      "กรุณาเพิ่มผู้รับผลประโยชน์อย่างน้อย 1 คน"
    );

    return;

  }


  // ==========================================
  // ตรวจทีละคน
  // ==========================================

  for (
    let i = 0;
    i < list.length;
    i++
  ) {

    const person =
      list[i];


    if (!person.Name) {

      alert(
        `กรุณากรอกชื่อ - นามสกุล ผู้รับผลประโยชน์คนที่ ${i + 1}`
      );

      return;

    }


    if (!person.Relation) {

      alert(
        `กรุณากรอกความสัมพันธ์ ผู้รับผลประโยชน์คนที่ ${i + 1}`
      );

      return;

    }


    if (!person.Age) {

      alert(
        `กรุณากรอกอายุ ผู้รับผลประโยชน์คนที่ ${i + 1}`
      );

      return;

    }


    if (!person.IDCard) {

      alert(
        `กรุณากรอกเลขบัตรประชาชน ผู้รับผลประโยชน์คนที่ ${i + 1}`
      );

      return;

    }


    const cleanID =
      person.IDCard.replace(/\D/g, "");


    if (cleanID.length !== 13) {

      alert(
        `เลขบัตรประชาชนของผู้รับผลประโยชน์คนที่ ${i + 1} ต้องมี 13 หลัก`
      );

      return;

    }


    person.IDCard =
      cleanID;

  }


  console.log(
    "BENEFICIARIES:",
    applicationData.Beneficiaries
  );

  // ==========================================
  // ไปหน้าตรวจสอบข้อมูล
  // ==========================================

  showReviewForm();
}

// ============================================
// UPDATE SUBMIT BUTTON
// ============================================

function updateSubmitButton() {

  const confirmInformation =
    document.getElementById(
      "confirmInformation"
    );

  const submitButton =
    document.getElementById(
      "submitApplicationButton"
    );


  // ถ้าอยู่คนละหน้า ไม่ต้องทำอะไร
  if (
    !confirmInformation ||
    !submitButton
  ) {

    return;

  }


  // ==========================================
  // 1. ยืนยันข้อมูล
  // ==========================================

  const informationConfirmed =
    confirmInformation.checked;


  // ==========================================
  // 2. รับทราบเงื่อนไขการรับประกัน
  // ==========================================

  const termsAccepted =
    applicationData.TermsAccepted === true;


  // ==========================================
  // 3. รับทราบ Privacy Notice
  // ==========================================

  const privacyAccepted =
    applicationData.PrivacyNoticeAccepted === true;


  // ==========================================
  // ต้องผ่านทั้ง 3 เงื่อนไข
  // ==========================================

  const canSubmit =
    informationConfirmed &&
    termsAccepted &&
    privacyAccepted;


  if (canSubmit) {

    // เปิดปุ่ม

    submitButton.disabled = false;

    submitButton.style.opacity = "1";

    submitButton.style.cursor =
      "pointer";

  } else {

    // ปิดปุ่ม

    submitButton.disabled = true;

    submitButton.style.opacity = "0.5";

    submitButton.style.cursor =
      "not-allowed";

  }


  // ==========================================
  // Debug
  // ==========================================

  console.log(
    "SUBMIT STATUS:",
    {
      informationConfirmed,
      termsAccepted,
      privacyAccepted,
      canSubmit
    }
  );

}

// ============================================

function finalSubmitApplication() {

  // ==========================================
  // ป้องกันกดซ้ำ
  // ==========================================

  if (
    applicationData.isSubmitting === true
  ) {

    return;

  }


  // ==========================================
  // ตรวจสอบเงื่อนไขการรับประกัน
  // ==========================================

  if (
    applicationData.TermsAccepted !== true
  ) {

    alert(
      "กรุณารับทราบเงื่อนไขการรับประกันก่อนครับ"
    );

    return;

  }


  // ==========================================
  // ตรวจสอบ PDPA
  // ==========================================

  if (
    applicationData.PrivacyNoticeAccepted !== true
  ) {

    alert(
      "กรุณารับทราบประกาศความเป็นส่วนตัวก่อนครับ"
    );

    return;

  }


  // ==========================================
  // ตรวจสอบข้อมูลสำคัญ
  // ==========================================

  if (
    !applicationData.FullName ||
    !applicationData.IDCard ||
    !applicationData.BirthDate ||
    !applicationData.Phone
  ) {

    alert(
      "ข้อมูลผู้สมัครไม่ครบถ้วน กรุณากลับไปตรวจสอบอีกครั้งครับ"
    );

    return;

  }


  // ==========================================
  // ผ่านทุกเงื่อนไข
  // ล็อกทันที
  // ==========================================

  applicationData.isSubmitting =
    true;


  // ==========================================
  // ปุ่ม Submit
  // ==========================================

  const submitButton =
    document.querySelector(
      'button[onclick="finalSubmitApplication()"]'
    );


  if (
    submitButton
  ) {

    submitButton.disabled =
      true;

    submitButton.textContent =
      "⏳ กำลังบันทึกข้อมูล...";

    submitButton.style.opacity =
      "0.7";

    submitButton.style.cursor =
      "not-allowed";

  }


  // ==========================================
  // เตรียมข้อมูล
  // ==========================================

  const finalApplicationData =
    prepareFinalApplicationData();


  console.log(
    "READY TO SUBMIT:",
    finalApplicationData
  );


  // ==========================================
  // ส่งข้อมูล
  // ==========================================

  try {

    sendApplicationTest(

// ============================================
// FORMAT ADDRESS FOR REVIEW
// ============================================

function formatAddress(address) {

  if (!address) {

    return "-";

  }


  const parts = [];


  if (address.HouseNo) {

    parts.push(
      `บ้านเลขที่ ${escapeHtml(
        address.HouseNo
      )}`
    );

  }


  if (address.Moo) {

    parts.push(
      `หมู่ ${escapeHtml(
        address.Moo
      )}`
    );

  }


  if (address.Soi) {

    parts.push(
      `ซอย ${escapeHtml(
        address.Soi
      )}`
    );

  }


  if (address.Road) {

    parts.push(
      `ถนน ${escapeHtml(
        address.Road
      )}`
    );

  }


  if (address.SubDistrict) {

    parts.push(
      `${escapeHtml(
        address.SubDistrict
      )}`
    );

  }


  if (address.District) {

    parts.push(
      `${escapeHtml(
        address.District
      )}`
    );

  }


  if (address.Province) {

    parts.push(
      `${escapeHtml(
        address.Province
      )}`
    );

  }


  if (address.PostalCode) {

    parts.push(
      escapeHtml(
        address.PostalCode
      )
    );

  }


  return parts.join(" ");

}

function insuranceTermsChanged() {

  const checkbox =
    document.getElementById(
      "acceptInsuranceTerms"
    );

  const button =
    document.getElementById(
      "acceptInsuranceTermsButton"
    );


  if (!checkbox || !button) {

    return;

  }


  if (checkbox.checked) {

    button.disabled = false;

    button.style.background =
      "#2e7d32";

    button.style.color =
      "white";

    button.style.cursor =
      "pointer";

  } else {

    button.disabled = true;

    button.style.background =
      "#ddd";

    button.style.color =
      "#999";

    button.style.cursor =
      "not-allowed";

  }

}

function formatAddress(address) {

  if (!address) {

    return "-";

  }


  const parts = [

    address.HouseNo
      ? `บ้านเลขที่ ${address.HouseNo}`
      : "",

    address.Moo
      ? `หมู่ ${address.Moo}`
      : "",

    address.Soi
      ? `ซอย ${address.Soi}`
      : "",

    address.Road
      ? `ถนน ${address.Road}`
      : "",

    address.SubDistrict
      ? `ตำบล/แขวง ${address.SubDistrict}`
      : "",

    address.District
      ? `อำเภอ/เขต ${address.District}`
      : "",

    address.Province
      ? `จังหวัด ${address.Province}`
      : "",

    address.PostalCode
      ? `รหัสไปรษณีย์ ${address.PostalCode}`
      : ""

  ];


  return parts
    .filter(Boolean)
    .join(" ");

}
  
// ============================================
// STATUS
// ============================================

function setStatus(message) {

  document.getElementById(
    "status"
  ).innerHTML = message;

}

function requiredLabel(text) {

  return `
    <label>
      ${text}
      <span class="required">*</span>
    </label>
  `;

}

function getRequiredValue(id, message) {

  const element =
    document.getElementById(id);

  if (!element) {

    return "";

  }

  const value =
    element.value.trim();

  if (!value) {

    alert(message);

    element.focus();

    return null;

  }

  return value;

}

// ============================================
// SECURITY
// ============================================

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
